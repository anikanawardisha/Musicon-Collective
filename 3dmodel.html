<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1F2E24" />
  <meta name="description" content="Musicon Collective – leg, skab, del og mød i et kreativt fællesskab." />
  <title>Musicon Collective | Leg · Skab · Del · Mød</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
  <link rel="manifest" href="manifest.json"> <!----->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <link rel="apple-touch-icon" href="images/icon-192.png"> <!---->
<script>
            // Check that service workers are registered
            if ('serviceWorker' in navigator) {
                // Use the window load event to keep the page load performant
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./service-worker.js');
                });
            }
    </script>

     <script src="app.js" defer></script>
  
</head>
<body>
    <model-viewer 
            camera-controls 
            touch-action="pan-y" 
            disable-pan 
            environment-image="media/360-image.hdr" 
            skybox-image="media/360-image.hdr" 
            skybox-height="0.05m"
            orientation="0deg -90deg 0deg"
            shadow-intensity="2" 
            max-camera-orbit="auto 90deg auto" 
            alt="Container Living" 
            src="media/billede.png" 
            style="width:100%; height:250px;"
        >
        </model-viewer>
</body>
</html>
